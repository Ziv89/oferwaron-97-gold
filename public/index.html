<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0d" />

    <!-- A tab opened before a deploy asks for the old /static/js/main.*.js,
         which no longer exists -> blank page. Reload once to pick up the new
         version (sessionStorage guard so a real outage can't loop). -->
    <script>
      window.addEventListener('error', function (e) {
        var el = e.target;
        var url = el && (el.src || el.href);
        if (!url || !/\/static\/(js|css)\//.test(url)) return;
        var last = Number(sessionStorage.getItem('staleBundleReload') || 0);
        if (Date.now() - last < 30000) return;
        sessionStorage.setItem('staleBundleReload', String(Date.now()));
        window.location.reload();
      }, true);
    </script>

    <!-- Default meta (per-page tags from <Seo> override these once React runs;
         these are what non-JS scrapers like WhatsApp/Facebook fall back to) -->
    <title>97% Gold — Professional XAUUSD Gold Trading Signals</title>
    <meta
      name="description"
      content="Gold (XAUUSD) trading signals with proven live results. Real-time WhatsApp alerts with clear entry, exit and stop-loss levels."
    />
    <link rel="canonical" href="https://www.oferwaron.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="97% Gold" />
    <meta property="og:title" content="97% Gold — Professional Gold Trading Signals" />
    <meta property="og:description" content="Real-time XAUUSD signals with entry, exit and stop-loss. Proven live performance." />
    <meta property="og:url" content="https://www.oferwaron.com/" />
    <meta property="og:image" content="https://www.oferwaron.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="97% Gold — Professional Gold Trading Signals" />
    <meta name="twitter:description" content="Real-time XAUUSD signals with entry, exit and stop-loss." />
    <meta name="twitter:image" content="https://www.oferwaron.com/og-image.jpg" />

    <!-- Structured data: helps Google build a rich result for the brand + person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "97% Gold",
      "url": "https://www.oferwaron.com/",
      "logo": "https://www.oferwaron.com/og-image.jpg",
      "founder": { "@type": "Person", "name": "Ofer Waron" },
      "description": "Professional XAUUSD (gold) trading signals delivered in real time via WhatsApp."
    }
    </script>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Heebo - Hebrew text of the Strategy page Alert System Overview -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
