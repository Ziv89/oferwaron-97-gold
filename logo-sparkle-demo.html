<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Sparkle Effects</title>
<style>
  :root {
    --logo: none; /* set from the script below */
    --bg: radial-gradient(ellipse at 30% 20%, #ffffff 0%, #f1ede6 45%, #ddd6c9 100%);
    --card: rgba(255, 255, 255, 0.72);
    --card-border: rgba(212, 175, 55, 0.45);
    --text: #2a2216;
    --muted: #6d6150;
    --gold: #d4af37;
    --gold-deep: #9a7412;
    --badge-bg: #25d366;
  }
  body.dark {
    --bg: radial-gradient(ellipse at 30% 20%, #262017 0%, #0f0c08 55%, #000 100%);
    --card: rgba(24, 20, 14, 0.8);
    --card-border: rgba(212, 175, 55, 0.35);
    --text: #f5e9c8;
    --muted: #b9a982;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 16px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: end;
    justify-content: space-between;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); color: var(--gold-deep); }
  body.dark h1 { color: var(--gold); }
  header p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--gold); background: transparent; color: var(--text);
  }
  .toolbar button[aria-pressed="true"] { background: var(--gold); color: #1b1409; }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 16px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 18px;
    padding: 18px;
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card h2 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
  .badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--badge-bg); color: #fff; }
  .code { font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; color: var(--gold-deep); }
  body.dark .code { color: var(--gold); }
  .stage { display: flex; justify-content: center; padding: 22px 0 10px; }

  /* ---------- the logo box shared by every effect ---------- */
  .logo {
    position: relative;
    width: min(240px, 70vw);
    aspect-ratio: 659 / 643;
    isolation: isolate;
  }
  .logo img { position: relative; z-index: 2; display: block; width: 100%; height: 100%; }
  .logo .fx { position: absolute; pointer-events: none; }
  .logo .over { inset: -14px; z-index: 5; }
  .logo .under { inset: 0; z-index: 0; }

  /* Mask = the logo itself, so shine only lands on gold & diamonds */
  .masked {
    inset: 0; z-index: 3;
    -webkit-mask: var(--logo) center / contain no-repeat;
    mask: var(--logo) center / contain no-repeat;
    mix-blend-mode: screen;
  }
  .sweep {
    position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,240,180,.25) 42%, rgba(255,255,255,.9) 50%, rgba(255,240,180,.25) 58%, transparent 70%);
    background-size: 300% 100%;
    animation: sweep 3.2s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes sweep { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  .glow img { filter: drop-shadow(0 0 4px rgba(255,223,90,.75)) drop-shadow(0 0 16px rgba(255,190,40,.45)); }

  .halo {
    inset: 8% 10%; z-index: 0; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,236,150,.55), rgba(255,200,60,.25) 55%, transparent);
    animation: halo 4s ease-in-out infinite;
  }
  @keyframes halo { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }

  /* 4-point star flare */
  .star {
    position: absolute; translate: -50% -50%; opacity: 0;
    background: radial-gradient(circle, #fff 0 8%, rgba(255,245,200,.85) 14%, transparent 34%);
    animation: twinkle 3.4s ease-in-out infinite;
  }
  .star::before, .star::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, transparent, rgba(255,250,220,.95) 50%, transparent) center / 100% 2px no-repeat,
      linear-gradient(0deg, transparent, rgba(255,250,220,.95) 50%, transparent) center / 2px 100% no-repeat;
    filter: drop-shadow(0 0 3px rgba(255,215,0,.9));
  }
  .star::after { inset: 22%; transform: rotate(45deg); opacity: .7; }
  @keyframes twinkle {
    0%, 62%, 100% { opacity: 0; transform: scale(.2) rotate(0); }
    72% { opacity: 1; transform: scale(1) rotate(25deg); }
    84% { opacity: .85; transform: scale(.8) rotate(45deg); }
  }

  /* Prism: rainbow-tinted flares, like light split by a diamond */
  .prism .star { animation-name: twinkle, prism; animation-duration: 3.4s, 2.4s; animation-iteration-count: infinite; }
  .prism .star::before, .prism .star::after {
    background:
      linear-gradient(90deg, transparent, #ff7ad9 25%, #fff 50%, #6fe3ff 75%, transparent) center / 100% 2px no-repeat,
      linear-gradient(0deg, transparent, #ffe46b 25%, #fff 50%, #8f8bff 75%, transparent) center / 2px 100% no-repeat;
  }
  @keyframes prism { from { filter: hue-rotate(0deg) saturate(1.6); } to { filter: hue-rotate(360deg) saturate(1.6); } }

  /* Liquid gold: double sweep + brightness pulse */
  .liquid img { animation: bright 2.6s ease-in-out infinite; }
  @keyframes bright {
    0%,100% { filter: brightness(1) saturate(1.05) drop-shadow(0 0 6px rgba(255,200,40,.5)); }
    50% { filter: brightness(1.18) saturate(1.3) drop-shadow(0 0 14px rgba(255,210,60,.8)); }
  }
  .liquid .sweep + .sweep { animation-delay: 1.6s; opacity: .7; }

  /* Royal burst: slowly rotating sunburst rays behind the logo */
  .rays {
    inset: -18%; z-index: 0; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,215,0,.32) 0deg 4deg, transparent 4deg 18deg);
    -webkit-mask: radial-gradient(closest-side, #000 25%, transparent 100%);
    mask: radial-gradient(closest-side, #000 25%, transparent 100%);
    animation: spin 28s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Glitter dots + falling gold dust */
  .dot {
    position: absolute; border-radius: 50%; opacity: 0; background: #ffd700;
    box-shadow: 0 0 3px 1px rgba(255,215,0,.9), 0 0 8px 2px rgba(255,180,0,.5);
    animation: blink ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1); } }
  .dust {
    position: absolute; top: -6%; width: 3px; height: 3px; border-radius: 50%;
    background: #ffe27a; box-shadow: 0 0 6px 2px rgba(255,210,60,.7);
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(330px) translateX(14px); opacity: 0; }
  }

  /* Breathing glow - the calmest option */
  .breathe img { animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { filter: drop-shadow(0 0 3px rgba(255,215,0,.5)); }
    50% { filter: drop-shadow(0 0 18px rgba(255,205,50,.95)) brightness(1.08); }
  }

  body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    body:not(.force-motion) .fx, body:not(.force-motion) .fx *, body:not(.force-motion) img { animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>OferWaron logo — sparkle effects</h1>
    <p>The updated, brighter gold &amp; diamond logo with seven sparkle treatments. Option&nbsp;3 is live on the site now; tell me the number you prefer and I'll swap it in.</p>
  </div>
  <div class="toolbar">
    <button type="button" id="bgBtn" aria-pressed="false">Dark background</button>
    <button type="button" id="pauseBtn" aria-pressed="false">Pause</button>
  </div>
</header>

<main id="grid"></main>

  var FLARES = [
    [36,12,34,0],[58,9,26,1.1],[72,20,30,2.3],[20,36,32,.6],[47,18,22,1.8],
    [77,58,26,2.9],[37,66,24,1.4],[8,86,30,.3],[44,83,22,2.6],[90,88,26,1.9]
  ];

  function stars(scale) {
    return FLARES.map(function (f) {
      var s = Math.round(f[2] * (scale || 1));
      return '<span class="star" style="left:' + f[0] + '%;top:' + f[1] + '%;width:' + s + 'px;height:' + s + 'px;animation-delay:' + f[3] + 's"></span>';
    }).join('');
  }
  function dots(n) {
    var out = '';
    for (var i = 0; i < n; i++) {
      var size = 2 + Math.random() * 4;
      out += '<span class="dot" style="left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) +
        '%;width:' + size + 'px;height:' + size + 'px;animation-delay:' + (Math.random() * 3) +
        's;animation-duration:' + (0.8 + Math.random() * 1.2) + 's"></span>';
    }
    return out;
  }
  function dust(n) {
    var out = '';
    for (var i = 0; i < n; i++) {
      out += '<span class="dust" style="left:' + (Math.random() * 100) + '%;animation-delay:' + (Math.random() * 5) +
        's;animation-duration:' + (3 + Math.random() * 3) + 's"></span>';
    }
    return out;
  }
  var masked = function (sweeps) {
    return '<div class="fx masked">' + new Array(sweeps + 1).join('<div class="sweep"></div>') + '</div>';
  };

  var VARIANTS = [
    { name: 'Diamond Star Flares', cls: 'glow',
      desc: 'Star glints on the jewels like the original artwork, a gold halo, and a shine sweep that only crosses the gold.',
      under: '<div class="fx halo"></div>', over: masked(1) + '<div class="fx over">' + stars() + '</div>' },
    { name: 'Prism Rainbow Glints', cls: 'glow prism',
      desc: 'Same flares, but each one splits into rainbow colours the way light does in a real diamond.',
      under: '<div class="fx halo"></div>', over: masked(1) + '<div class="fx over">' + stars(1.1) + '</div>' },
    { name: 'Liquid Gold', live: true, cls: 'liquid',
      desc: 'Two shine bands roll across while the gold brightens and warms in a slow pulse. Rich, without extra stars.',

    { name: 'Royal Burst', cls: 'glow',
      desc: 'Soft sunburst rays turn slowly behind the logo, with star flares on top. The most dramatic.',
      under: '<div class="fx rays"></div><div class="fx halo"></div>', over: masked(1) + '<div class="fx over">' + stars() + '</div>' },
    { name: 'Glitter Storm', cls: 'glow',
      desc: 'Lots of tiny gold glitter twinkling around the logo while gold dust drifts down.',
      under: '', over: '<div class="fx over">' + dots(40) + dust(14) + '</div>' },
    { name: 'Breathing Glow', cls: 'breathe',
      desc: 'Calmest option: the gold glow gently swells and fades. No moving particles.',
      under: '', over: '' },
    { name: 'Diamond Crown (everything)', cls: 'glow prism',
      desc: 'Rays, halo, rainbow flares, glitter and the double shine together. Maximum sparkle.',
      under: '<div class="fx rays"></div><div class="fx halo"></div>',
      over: masked(2) + '<div class="fx over">' + stars(1.15) + dots(22) + '</div>' }
  ];

  document.getElementById('grid').innerHTML = VARIANTS.map(function (v, i) {
    return '<section class="card">' +
      '<h2>' + (i + 1) + '. ' + v.name + (v.live ? ' <span class="badge">Live on site</span>' : '') + '</h2>' +
      '<div class="stage"><div class="logo ' + v.cls + '">' + v.under +
        '<img src="' + LOGO + '" alt="OferWaron gold Santa logo">' + v.over + '</div></div>' +
      '<p>' + v.desc + '</p>' +
      '<span class="code">Option ' + (i + 1) + '</span>' +
    '</section>';
  }).join('');

  function toggle(btn, cls) {
    btn.addEventListener('click', function () {
      var on = document.body.classList.toggle(cls);
      btn.setAttribute('aria-pressed', on);
    });
  }
  toggle(document.getElementById('bgBtn'), 'dark');
  toggle(document.getElementById('pauseBtn'), 'paused');
